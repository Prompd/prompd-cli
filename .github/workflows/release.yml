name: Release Go CLI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.20'
    
    - name: Build
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
      run: |
        cd cli/prompd/go
        mkdir -p ../../../dist
        
        if [ "$GOOS" = "windows" ]; then
          EXT=".exe"
        else
          EXT=""
        fi
        
        OUTPUT="../../../dist/prompd-${GOOS}-${GOARCH}${EXT}"
        go build -ldflags "-s -w" -o "$OUTPUT" ./cmd/prompd
        
        # Create archive
        cd ../../../dist
        if [ "$GOOS" = "windows" ]; then
          zip "prompd-${GOOS}-${GOARCH}.zip" "prompd-${GOOS}-${GOARCH}${EXT}"
        else
          tar -czf "prompd-${GOOS}-${GOARCH}.tar.gz" "prompd-${GOOS}-${GOARCH}"
        fi
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v3
      with:
        name: prompd-binaries
        path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v3
      with:
        name: prompd-binaries
        path: dist/
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: dist/*
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}