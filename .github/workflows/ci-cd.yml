name: Prompd Workflow Engine CI/CD

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'cli/npm/**'
      - '.github/workflows/**'
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
    paths:
      - 'cli/npm/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: prompd/workflow-engine
  NODE_VERSION: 18

jobs:
  # Security and dependency scanning
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'cli/npm'
          format: 'sarif'
          output: 'trivy-results.sarif'
          
      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # Test and build
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli/npm
        
    strategy:
      matrix:
        node-version: [18, 20]
        
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: cli/npm/package-lock.json
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run security audit
        run: npm audit --audit-level moderate
        
      - name: Run linting
        run: npm run lint
        
      - name: Run type checking
        run: npm run type-check
        
      - name: Run unit tests
        run: npm test -- --coverage
        
      - name: Run integration tests
        run: npm run test:integration
        
      - name: Build application
        run: npm run build
        
      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        if: matrix.node-version == 18
        with:
          directory: cli/npm/coverage
          
      - name: Cache build artifacts
        uses: actions/cache@v4
        if: matrix.node-version == 18
        with:
          path: cli/npm/dist
          key: build-${{ github.sha }}

  # Docker build and security scan
  docker-build:
    name: Docker Build & Scan
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: cli/npm
        
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: cli/npm
          file: cli/npm/Dockerfile
          push: false
          tags: ${{ env.IMAGE_NAME }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          
      - name: Run Trivy vulnerability scanner on image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:test
          format: 'sarif'
          output: 'docker-trivy-results.sarif'
          
      - name: Upload Docker scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'docker-trivy-results.sarif'

  # Workflow validation tests
  workflow-tests:
    name: Workflow Integration Tests
    runs-on: ubuntu-latest
    needs: docker-build
    defaults:
      run:
        working-directory: cli/npm
        
    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
          
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: cli/npm/package-lock.json
          
      - name: Install dependencies
        run: npm ci
        
      - name: Start workflow engine
        run: |
          npm run build
          npm start &
          sleep 10
        env:
          NODE_ENV: test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-key-for-ci
          
      - name: Run workflow execution tests
        run: npm run test:workflows
        
      - name: Test OAuth flow
        run: npm run test:auth
        
      - name: Test MCP integration
        run: npm run test:mcp

  # Staging deployment
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [security-scan, test, docker-build, workflow-tests]
    if: github.ref == 'refs/heads/develop'
    environment: staging
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
          
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        
      - name: Build and push Docker image to ECR
        uses: docker/build-push-action@v5
        with:
          context: cli/npm
          file: cli/npm/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.IMAGE_NAME }}:staging-${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.IMAGE_NAME }}:staging-latest
            
      - name: Deploy to ECS Staging
        run: |
          aws ecs update-service \
            --cluster prompd-staging \
            --service prompd-workflow-engine \
            --force-new-deployment \
            --task-definition prompd-staging:${{ github.sha }}

  # Production deployment
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [security-scan, test, docker-build, workflow-tests]
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
          
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        
      - name: Build and push Docker image to ECR
        uses: docker/build-push-action@v5
        with:
          context: cli/npm
          file: cli/npm/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.IMAGE_NAME }}:latest
            
      - name: Deploy to ECS Production
        run: |
          aws ecs update-service \
            --cluster prompd-production \
            --service prompd-workflow-engine \
            --force-new-deployment \
            --task-definition prompd-production:${{ github.ref_name }}
            
      - name: Update load balancer health checks
        run: |
          aws elbv2 describe-target-health \
            --target-group-arn ${{ secrets.TARGET_GROUP_ARN }} \
            --query 'TargetHealthDescriptions[0].TargetHealth.State'

  # Multi-cloud deployment (optional)
  deploy-multicloud:
    name: Deploy to Multiple Clouds
    runs-on: ubuntu-latest
    needs: deploy-production
    if: startsWith(github.ref, 'refs/tags/v')
    environment: multicloud
    
    strategy:
      matrix:
        cloud: [gcp, azure]
        
    steps:
      - uses: actions/checkout@v4
      
      # GCP deployment
      - name: Setup GCP
        if: matrix.cloud == 'gcp'
        uses: google-github-actions/setup-gcloud@v2
        with:
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          
      - name: Deploy to Google Cloud Run
        if: matrix.cloud == 'gcp'
        run: |
          gcloud run deploy prompd-workflow-engine \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }} \
            --region us-central1 \
            --allow-unauthenticated \
            --max-instances 10 \
            --memory 1Gi \
            --cpu 1
            
      # Azure deployment
      - name: Login to Azure
        if: matrix.cloud == 'azure'
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          
      - name: Deploy to Azure Container Instances
        if: matrix.cloud == 'azure'
        uses: azure/aci-deploy@v1
        with:
          resource-group: prompd-rg
          dns-name-label: prompd-workflow-${{ github.ref_name }}
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          name: prompd-workflow-engine
          location: eastus

  # Post-deployment verification
  post-deploy-verify:
    name: Post-Deployment Verification
    runs-on: ubuntu-latest
    needs: deploy-production
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Wait for deployment
        run: sleep 60
        
      - name: Health check
        run: |
          curl -f https://api.prompd.com/health || exit 1
          
      - name: Smoke tests
        run: |
          # Test workflow execution
          curl -X POST https://api.prompd.com/workflows/test \
            -H "Authorization: Bearer ${{ secrets.API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"test": true}' || exit 1
            
      - name: Performance tests
        run: |
          # Basic load test
          for i in {1..10}; do
            curl -s https://api.prompd.com/health &
          done
          wait
          
      - name: Security verification
        run: |
          # Test security headers
          curl -I https://api.prompd.com/ | grep -i "strict-transport-security" || exit 1
          
      - name: Rollback on failure
        if: failure()
        run: |
          aws ecs update-service \
            --cluster prompd-production \
            --service prompd-workflow-engine \
            --task-definition prompd-production:previous