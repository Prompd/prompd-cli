<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#007acc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#005a9e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#grad1)" stroke="#003d6b" stroke-width="2"/>
  
  <!-- Document outline -->
  <rect x="30" y="20" width="68" height="88" rx="4" ry="4" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  
  <!-- YAML frontmatter lines -->
  <line x1="35" y1="28" x2="93" y2="28" stroke="#007acc" stroke-width="2"/>
  <line x1="35" y1="35" x2="85" y2="35" stroke="#cccccc" stroke-width="1"/>
  <line x1="35" y1="40" x2="75" y2="40" stroke="#cccccc" stroke-width="1"/>
  <line x1="35" y1="45" x2="90" y2="45" stroke="#cccccc" stroke-width="1"/>
  <line x1="35" y1="52" x2="93" y2="52" stroke="#007acc" stroke-width="2"/>
  
  <!-- Content lines -->
  <line x1="35" y1="65" x2="90" y2="65" stroke="#333333" stroke-width="1"/>
  <line x1="35" y1="72" x2="85" y2="72" stroke="#333333" stroke-width="1"/>
  <line x1="35" y1="79" x2="95" y2="79" stroke="#333333" stroke-width="1"/>
  
  <!-- Variable placeholder -->
  <rect x="45" y="86" width="25" height="8" rx="2" ry="2" fill="#ff6b6b" opacity="0.8"/>
  <text x="57" y="92" font-family="monospace" font-size="6" fill="#ffffff" text-anchor="middle">{var}</text>
  
  <!-- Small "PMD" text at bottom -->
  <text x="64" y="102" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#ffffff" text-anchor="middle">PMD</text>
</svg>